<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Welcome to the lol project!
    </title>
    <style>
      * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0f8ff;
      color: #1f2937;
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 20px 60px 20px;
    }

    #lollogo {
      text-align: center;
      margin-bottom: 20px;
    }

    #lollogo img {
      height: 120px;
      max-width: 100%;
      width: auto;
      display: inline-block;
    }

    .header-nav-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      max-width: 680px;
      margin: 0 auto 24px auto;
    }

    .nav-wrapper {
      position: relative;
    }

    .profile-link-btn, .notif-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1f2937;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: 1px solid #d1d5db;
      padding: 8px 16px;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .notif-btn {
      padding: 8px 14px;
      position: relative;
    }

    .profile-link-btn:hover, .notif-btn:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    .notif-badge {
      background: #ef4444;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 9999px;
      display: none;
    }

    .profile-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .nav-dropdown-menu, .notif-dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.12);
      width: 210px;
      z-index: 100;
      overflow: hidden;
    }

    .notif-dropdown-menu {
      width: 300px;
    }

    .notif-header {
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.88rem;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notif-list {
      max-height: 260px;
      overflow-y: auto;
    }

    .notif-item {
      padding: 10px 14px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.86rem;
      color: #374151;
    }

    .notif-item.unread {
      background: #eff6ff;
      font-weight: 500;
    }

    .nav-dropdown-menu a {
      display: block;
      padding: 10px 16px;
      text-decoration: none;
      color: #374151;
      font-size: 0.95rem;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s ease;
    }

    .nav-dropdown-menu a:last-child {
      border-bottom: none;
    }

    .nav-dropdown-menu a:hover {
      background: #f3f4f6;
    }

    .nav-dropdown-menu a.logout-link {
      color: #dc2626;
      font-weight: 500;
    }

    #site-content {
      max-width: 680px;
      margin: 0 auto 24px auto;
      padding: 28px 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 1.85rem;
      color: #111827;
      margin-bottom: 10px;
    }

    #lolinfo p {
      color: #4b5563;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    #lolinfo p:last-child {
      margin-bottom: 0;
    }

    /* Main Layout: Expands when PDF Viewer is active */
    .workspace-layout {
      max-width: 680px;
      margin: 0 auto;
      transition: max-width 0.25s ease;
    }

    .workspace-layout.pdf-mode {
      max-width: 1220px;
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .workspace-layout.pdf-mode {
        grid-template-columns: 1fr;
      }
    }

    /* PDF Document Viewer Panel */
    .pdf-viewer-panel {
      display: none;
      background: #525659;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 20px;
    }

    .workspace-layout.pdf-mode .pdf-viewer-panel {
      display: block;
    }

    .pdf-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #323639;
      color: #f3f4f6;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .pdf-toolbar-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-close-btn {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pdf-close-btn:hover {
      background: #dc2626;
    }

    .pdf-sheet {
      background: #ffffff;
      min-height: 460px;
      padding: 48px 44px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      font-family: Georgia, 'Times New Roman', serif;
      color: #111827;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pdf-doc-header {
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 14px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .pdf-doc-author {
      font-weight: 700;
      font-size: 1.05rem;
      color: #111827;
      cursor: pointer;
    }

    .pdf-doc-author:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    .pdf-doc-meta {
      font-size: 0.85rem;
      color: #6b7280;
    }

    .pdf-doc-body {
      font-size: 1.15rem;
      line-height: 1.8;
      white-space: pre-wrap;
      flex: 1;
    }

    .pdf-doc-body.elite-rendered {
      white-space: normal;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .pdf-doc-footer {
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
      margin-top: 32px;
      display: flex;
      justify-content: space-between;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    /* Composer & Live Preview Styles */
    .composer-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    .composer-top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
    }

    .collab-select {
      padding: 5px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #f9fafb;
    }

    .privilege-toggles {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .elite-toggle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      color: #7c3aed;
      cursor: pointer;
    }

    .owner-toggle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      color: #b45309;
      cursor: pointer;
    }

    .composer-card textarea {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .composer-card textarea.elite-code-mode {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      background: #faf5ff;
      border-color: #c4b5fd;
    }

    .composer-card textarea.fulljs-code-mode {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      background: #fffbeb;
      border-color: #fcd34d;
    }

    .composer-card textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* Live Preview Box */
    .live-preview-box {
      display: none;
      background: #f8fafc;
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .live-preview-box.visible {
      display: block;
    }

    .live-preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    .run-preview-js-btn {
      background: #d97706;
      color: #ffffff;
      border: none;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }

    .run-preview-js-btn:hover {
      background: #b45309;
    }

    .live-preview-content {
      font-size: 0.98rem;
      color: #1f2937;
      min-height: 28px;
      word-break: break-word;
    }

    .live-preview-content.plain-text {
      white-space: pre-wrap;
    }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .char-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
Use code with caution.

}
.composer-actions-right {
display: flex;

background: #f3f4f6;

.shortnote-tag {

.owner-badge {

.notemaker-badge {
background: #dcfce7;

}
.post-btn {
background-color: #2563eb;
color: #ffffff;
border: none;
padding: 9px 20px;
border-radius: 9999px;
font-weight: 600;
font-size: 0.95rem;
cursor: pointer;
transition: background-color 0.2s;
}
.post-btn:hover {

}
.login-prompt {
text-align: center;
color: #4b5563;
font-size: 0.95rem;
}
.login-prompt a {
color: #2563eb;
font-weight: 600;
text-decoration: none;
}
.feed-header-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 14px;
padding: 0 4px;
}
.feed-title {
font-size: 1.15rem;
font-weight: 700;
color: #111827;
}
.simulate-btn {
background: #ffffff;
border: 1px solid #d1d5db;
color: #374151;
font-size: 0.8rem;
font-weight: 600;
padding: 5px 10px;
border-radius: 8px;
cursor: pointer;
}
.simulate-btn:hover {

}
.note-card {
background: #ffffff;
border-radius: 16px;
padding: 20px 24px;
box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
margin-bottom: 14px;
border: 2px solid transparent;
transition: border-color 0.15s;
}
.note-card.active-pdf {

}
.note-header {
display: flex;
justify-content: space-between;

margin-bottom: 10px;
}
.note-author-info {
display: flex;
align-items: center;
gap: 10px;
cursor: pointer;
}
.note-author-info:hover .note-author {
color: #2563eb;
text-decoration: underline;
}
.avatar-wrap {
position: relative;
flex-shrink: 0;
}
.note-avatar {
width: 40px;
height: 40px;
border-radius: 50%;
background: #dbeafe;
color: #1d4ed8;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
font-size: 1rem;
}
.online-dot {
position: absolute;
bottom: 0;
right: 0;
width: 11px;
height: 11px;
border-radius: 50%;
border: 2px solid #ffffff;
}
.online-dot.online {
background: #22c55e;
}
.online-dot.offline {
background: #9ca3af;
}
.author-name-line {
display: flex;
align-items: center;
gap: 6px;
flex-wrap: wrap;
}
.note-author {
font-weight: 700;
color: #111827;
font-size: 0.95rem;
}
.note-handle {
color: #6b7280;
font-size: 0.83rem;
}
.note-meta-right {
display: flex;
align-items: center;
gap: 8px;
position: relative;
}
.note-time {
font-size: 0.8rem;
color: #9ca3af;
}
.dots-btn {
background: none;
border: none;
font-size: 1.2rem;
font-weight: 700;
color: #6b7280;
cursor: pointer;
padding: 2px 8px;
border-radius: 6px;
line-height: 1;
}
.dots-btn:hover {
background: #f3f4f6;
color: #111827;
}
.dots-menu {
display: none;
position: absolute;
top: 28px;
right: 0;
background: #ffffff;
border: 1px solid #e5e7eb;
border-radius: 10px;
box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.12);
width: 225px;
z-index: 90;
overflow: hidden;
}
.dots-menu.open {
display: block;
}
.dots-menu button {
width: 100%;
text-align: left;
background: none;
border: none;
padding: 10px 14px;
font-size: 0.88rem;
color: #374151;
cursor: pointer;
border-bottom: 1px solid #f3f4f6;
display: block;
}
.dots-menu button:last-child {
border-bottom: none;
}
.dots-menu button:hover {
background: #f3f4f6;
}
.note-body {

white-space: pre-wrap;

}
.note-body.elite-rendered {

}

}
.note-body.pdf-clickable:hover {

}
.note-actions {

flex-wrap: wrap;
}
.action-btn {
background: none;
border: none;
color: #6b7280;
font-size: 0.88rem;
font-weight: 600;
cursor: pointer;
display: flex;
align-items: center;
gap: 5px;
transition: color 0.15s;
}
.action-btn:hover {
color: #2563eb;
}
.action-btn.liked {
color: #e11d48;
}
.action-btn.delete:hover {
color: #dc2626;
}
/* Reply Notes Section */
.replies-section {
display: none;
margin-top: 14px;
padding-top: 14px;
border-top: 1px dashed #e5e7eb;
}
.replies-section.open {
display: block;
}
.reply-item {
background: #f9fafb;
border-left: 3px solid #cbd5e1;
padding: 10px 14px;
border-radius: 0 10px 10px 0;
margin-bottom: 10px;
}
.reply-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 4px;
font-size: 0.85rem;
}
.reply-author {

cursor: pointer;
}
.reply-author:hover {

.reply-text.pdf-clickable:hover {

}
.reply-form {

gap: 8px;
margin-top: 10px;
}
.reply-form input {

font-size: 0.9rem;
}
.reply-form input:focus {

border-color: #2563eb;
}
.reply-form button {

color: #ffffff;
border: none;
padding: 8px 14px;
border-radius: 8px;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
}
.reply-form button:hover {
background: #1d4ed8;
}

}
.profile-modal-bio {

}
.profile-modal-notes-title {
font-size: 1rem;
font-weight: 700;
margin-bottom: 12px;

}
.profile-note-mini {

border: 1px solid #e5e7eb;

font-size: 0.93rem;
}

/* Sanitize Limited JS vs Unrestricted Full JS /
function sanitizeLimitedJs(html) {
return html
.replace(/
        <script\b[^<](?:(?!</script>
          )
          <[^<])</script>
            /gi, '[
            <script>
              blocked — Full JS requires Site Owner permission]')
.replace(/\b(localStorage|sessionStorage|document.cookie|eval|Function|fetch|XMLHttpRequest|window.location)\b/gi, '/restricted/');
}
function renderRichNote(rawText, allowFullJs) {
let formatted = rawText
.replace(/^### (.$)/gim, '$1')
.replace(/^## (.$)/gim, '$1')
.replace(/**(.?)**/g, '$1')
.replace(/*(.?)*/g, '$1')
.replace(/([^]+)`/g, '$1');
if (!allowFullJs) {
formatted = sanitizeLimitedJs(formatted);
}
return formatted;
}
function executeEmbeddedScripts(container) {
const scripts = container.querySelectorAll('script');
scripts.forEach(oldScript => {
const newScript = document.createElement('script');
Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
newScript.textContent = oldScript.textContent;
oldScript.parentNode.replaceChild(newScript, oldScript);
});
}

/* PDF Style Viewer Logic (Only opens if > 20 characters) */
function openPdfNote(id, isReply = false, parentId = null) {
const notes = getNotes();
let item = null;
if (!isReply) {
item = notes.find(n => n.id === id);
} else {
const parent = notes.find(n => n.id === parentId);
item = parent ? parent.replies.find(r => r.id === id) : null;
}
if (!item || item.text.length
              <= 20) return;
activePdfId = item.id;
activePdfAuthor = item.author;
const authorTitle = item.collaborator ? ${item.author} & ${item.collaborator} : item.author;
document.getElementById('pdf-doc-type').innerText = isReply ? 'Reply_Note.pdf' : 'Note_Document.pdf';
document.getElementById('pdf-author').innerText = authorTitle;
document.getElementById('pdf-handle').innerText = item.handle;
document.getElementById('pdf-time').innerText = item.time;
const bodyEl = document.getElementById('pdf-body');
const allowFullJs = item.isFullJsContent || hasFullJsPrivilege(item.author);
const allowElite = item.isEliteContent || isUserElite(item.author);
if (allowElite || allowFullJs) {
bodyEl.classList.add('elite-rendered');
bodyEl.innerHTML = renderRichNote(item.text, allowFullJs);
if (allowFullJs) executeEmbeddedScripts(bodyEl);
} else {
bodyEl.classList.remove('elite-rendered');
bodyEl.innerText = item.text;
}
document.getElementById('pdf-char-count').innerText = ${item.text.length} characters;
document.getElementById('
workspace').classList.add('pdf-mode');
renderNotes();
}
function closePdfViewer() {
activePdfId = null;
document.getElementById('workspace').classList.remove('pdf-mode');
renderNotes();
}

                  </button>
                  : '';
const card = document.createElement('article');
card.className = 'note-card' + (activePdfId === note.id ? ' active-pdf' : '');
card.innerHTML =
                  <div class="note-header">
                    <div class="note-author-info" onclick="openUserProfile('escapeAttr(note.author)')" title="View {escapeAttr(note.author)}'s profile">
                      <div class="avatar-wrap">
                        <div class="note-avatar">
                          note.author.charAt(0).toUpperCase()
                        </div>
                        {(isFriend || isOwner) ?: ''}
                      </div>
                      <div>
                        <div class="author-name-line">
                          <span class="note-author">
                            escapeHTML(note.author){note.collaborator ? & ${escapeHTML(note.collaborator)}` : ''}
badges{isFriend && !isOwner ? '🤝 Notemaker' : ''}

${escapeHTML(note.handle)}

${isShortnote ? 'shortnote' : ''}
${note.time}
⋮

👤 View Profile
${!isOwner ?
                            <button type="button" onclick="requestNotemaker('${escapeAttr(note.author)}')">
                              ${isFriend ? '🤝 Already Notemakers' : '➕ Ask to be Notemakers'}
                            </button>
                            : ''}
ownerGrantOption{!isShortnote ?
                            <button type="button" onclick="openPdfNote(${note.id})">
                              📄 Open in PDF Style
                            </button>
                            : ''}
                            <div class="note-body (elite || allowFullJs) ? 'elite-rendered' : '' {!isShortnote ? 'pdf-clickable' : ''}"
{!isShortnote ? `onclick="openPdfNote(${note.id})" title="Click to open in PDF view"` : ''}>
                              {(elite || allowFullJs) ? renderRichNote(note.text, allowFullJs) : escapeHTML(note.text)}
note.liked ? '❤️' : '🤍' {note.likes}


💬 Reply Notes (${note.replies.length})

${!isShortnote ?
                              <button type="button" class="action-btn" onclick="openPdfNote(${note.id})">
                                📄 PDF View
                              </button>
                              : ''}
${isOwner ?
                              <button type="button" class="action-btn delete" onclick="deleteNote(${note.id})">
                                🗑️ Delete
                              </button>
                              : ''}
${repliesHTML}
                              <input type="text" id="reply-input-${note.id}" maxlength="280" placeholder="isLoggedIn ? 'Write a reply note...' : 'Log in to write a reply note...'" {!isLoggedIn ? 'disabled' : ''}>
                              ${isLoggedIn ? 'Reply' : 'Log In'}


`;
feed.appendChild(card);
if (allowFullJs) {
executeEmbeddedScripts(card);
}
});
}
function escapeHTML(str) {
return str.replace(/[&
                              <>
                                '"]/g, tag => ({
'&': '&',
'
                                <': '<',
'>
                                  ': '>',
"'": ''',
'"': '"'
}[tag]));
}
function escapeAttr(str) {
return str.replace(/'/g, "\'").replace(/"/g, '"');
}
function handleNavClick(e) {
if (e) e.stopPropagation();
document.getElementById('notif-dropdown').style.display = 'none';
if (!isLoggedIn) {
window.location.href = "login.html";
} else {
const dropdown = document.getElementById('account-dropdown');
dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
}
}
function logoutUser(e) {
e.preventDefault();
localStorage.setItem('loggedIn', 'false');
window.location.reload();
}
window.addEventListener('click', (e) => {
const navButton = document.getElementById('dynamic-user-nav');
const dropdown = document.getElementById('account-dropdown');
const notifBtn = document.getElementById('notif-bell-btn');
const notifMenu = document.getElementById('notif-dropdown');
if (navButton && dropdown && !navButton.contains(e.target)) {
dropdown.style.display = 'none';
}
if (notifBtn && notifMenu && !notifBtn.contains(e.target) && !notifMenu.contains(e.target)) {
notifMenu.style.display = 'none';
}
if (!e.target.closest('.dots-btn') && !e.target.closest('.dots-menu')) {
closeAllDotsMenus();
}
});
