<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The lol project</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: #f0f8ff;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    button, textarea, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      color: #111827;
      font-size: 1.6rem;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .pill-button,
    .post-button,
    .close-button {
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #374151;
      padding: 8px 14px;
      font-weight: 600;
    }

    .pill-button:hover {
      background: #f3f4f6;
    }

    .notification-menu {
      display: none;
      position: absolute;
      right: 16px;
      top: 70px;
      z-index: 10;
      width: min(300px, calc(100vw - 32px));
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 24px #0002;
    }

    .notification-menu.open {
      display: block;
    }

    .notification-heading {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f9fafb;
      font-weight: 700;
    }

    .notification-item {
      padding: 10px 14px;
      border-top: 1px solid #f3f4f6;
      font-size: 0.9rem;
    }

    .notification-item.unread {
      background: #eff6ff;
    }

    .intro,
    .composer,
    .note-card {
      margin-bottom: 16px;
      padding: 20px 22px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 16px #0000000d;
    }

    .intro {
      text-align: center;
    }

    .intro p {
      margin: 8px 0 0;
      color: #4b5563;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 100px;
      margin: 12px 0;
      padding: 12px;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    .composer textarea:focus,
    .reply-form input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    .composer-footer,
    .note-header,
    .note-actions,
    .reply-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .muted {
      color: #6b7280;
      font-size: 0.88rem;
    }

    .post-button {
      border-color: #2563eb;
      background: #2563eb;
      color: white;
    }

    .post-button:hover {
      background: #1d4ed8;
    }

    .feed-title {
      margin: 22px 0 12px;
      font-size: 1.15rem;
    }

    .note-header {
      margin-bottom: 10px;
    }

    .note-author {
      font-weight: 700;
      color: #111827;
    }

    .note-time {
      color: #9ca3af;
      font-size: 0.82rem;
    }

    .note-body {
      margin: 12px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note-body h2,
    .note-body h3 {
      margin: 8px 0;
    }

    .note-body code {
      padding: 2px 4px;
      border-radius: 4px;
      background: #f3f4f6;
      font-family: ui-monospace, monospace;
    }

    .note-actions {
      justify-content: flex-start;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
    }

    .text-button {
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: #4b5563;
      font-weight: 600;
    }

    .text-button:hover {
      color: #2563eb;
    }

    .text-button.liked {
      color: #e11d48;
    }

    .reply-list {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #d1d5db;
    }

    .reply-item {
      margin-bottom: 8px;
      padding: 10px 12px;
      border-left: 3px solid #cbd5e1;
      border-radius: 0 8px 8px 0;
      background: #f9fafb;
    }

    .reply-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .reply-form input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    .reply-form button {
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      padding: 8px 12px;
    }

    .workspace {
      max-width: 680px;
      margin: 0 auto;
    }

    .workspace.pdf-mode {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.9fr);
      gap: 20px;
      max-width: 1220px;
    }

    .workspace.pdf-mode .feed-column {
      min-width: 0;
    }

    .pdf-panel {
      display: none;
      position: sticky;
      top: 16px;
      align-self: start;
      padding: 16px;
      border-radius: 14px;
      background: #525659;
      color: #fff;
    }

    .pdf-mode .pdf-panel {
      display: block;
    }

    .pdf-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .close-button {
      padding: 5px 10px;
      background: #ef4444;
      color: #fff;
      border: 0;
    }

    .pdf-sheet {
      min-height: 360px;
      padding: 28px;
      background: #fff;
      color: #111827;
      font-family: Georgia, "Times New Roman", serif;
      overflow-wrap: anywhere;
    }

    .pdf-meta {
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
      font: 0.9rem system-ui, sans-serif;
    }

    .pdf-content {
      white-space: pre-wrap;
    }

    @media (max-width: 850px) {
      .workspace.pdf-mode {
        grid-template-columns: 1fr;
      }

      .pdf-panel {
        position: static;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 16px 12px 32px;
      }

      .intro,
      .composer,
      .note-card {
        padding: 16px;
      }

      .header {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="header page">
    <h1>The lol project</h1>
    <div class="header-actions">
      <button class="pill-button" id="notification-button" type="button"
              aria-expanded="false" aria-controls="notification-menu">
        🔔 <span id="notification-count">0</span>
      </button>
      <button class="pill-button" id="login-button" type="button">Log in</button>
    </div>
  </header>

  <aside class="notification-menu" id="notification-menu" aria-label="Notifications">
    <div class="notification-heading">
      <span>Notifications</span>
      <button class="text-button" id="mark-read-button" type="button">Mark read</button>
    </div>
    <div id="notification-list"></div>
  </aside>

  <main class="workspace" id="workspace">
    <div class="feed-column">
      <section class="intro">
        <h2>Welcome to the lol project!</h2>
        <p>A small social platform for sharing notes and shortnotes.</p>
      </section>

      <section class="composer" id="composer">
        <label for="note-input"><strong>Write a note</strong></label>
        <textarea id="note-input" maxlength="1000"
                  placeholder="Write a note (up to 1,000 characters)..."></textarea>
        <div class="composer-footer">
          <span class="muted"><span id="char-count">0</span> / 1000 characters</span>
          <button class="post-button" id="post-button" type="button">Post note</button>
        </div>
        <p class="muted" id="login-prompt" hidden>
          You are viewing as a guest. Enter a username to post or reply.
        </p>
      </section>

      <h2 class="feed-title">Latest notes</h2>
      <section id="notes-feed" aria-live="polite"></section>
    </div>

    <aside class="pdf-panel" id="pdf-panel" aria-label="Note reader">
      <div class="pdf-toolbar">
        <strong>📄 Note reader</strong>
        <button class="close-button" id="close-pdf-button" type="button">Close</button>
      </div>
      <article class="pdf-sheet">
        <div class="pdf-meta">
          <strong id="pdf-author"></strong><br>
          <span id="pdf-time" class="muted"></span>
        </div>
        <div class="pdf-content" id="pdf-content"></div>
      </article>
    </aside>
  </main>

  <script>
    "use strict";

    const STORAGE_KEYS = {
      username: "lolUsername",
      notes: "lolNotes",
      notifications: "lolNotifications"
    };

    const starterNotes = [
      {
        id: 1,
        author: "Denis Kuizinas",
        time: "2h ago",
        text: "Welcome to The lol project! 🎉\nShare a note with the community.",
        likes: 2,
        liked: false,
        replies: []
      },
      {
        id: 2,
        author: "Sarah M.",
        time: "30m ago",
        text: "Hello world!",
        likes: 1,
        liked: false,
        replies: []
      }
    ];

    function readJSON(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value === null ? fallback : JSON.parse(value);
      } catch (error) {
        console.warn(`Could not read "${key}" from localStorage:`, error);
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.warn(`Could not save "${key}" to localStorage:`, error);
      }
    }

    function getNotes() {
      const notes = readJSON(STORAGE_KEYS.notes, starterNotes);
      if (!Array.isArray(notes)) return starterNotes;

      return notes.map(note => ({
        ...note,
        replies: Array.isArray(note.replies) ? note.replies : [],
        likes: Number.isFinite(note.likes) ? note.likes : 0
      }));
    }

    function getNotifications() {
      const notifications = readJSON(STORAGE_KEYS.notifications, []);
      return Array.isArray(notifications) ? notifications : [];
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    // Only basic formatting is supported. Input is escaped before markup is added.
    function formatNote(text) {
      return escapeHTML(text)
        .replace(/^### (.+)$/gm, "<h3>$1</h3>")
        .replace(/^## (.+)$/gm, "<h2>$1</h2>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    function currentUsername() {
      return localStorage.getItem(STORAGE_KEYS.username) || "";
    }

    function renderNotifications() {
      const notifications = getNotifications();
      const unreadCount = notifications.filter(item => item.unread).length;

      document.getElementById("notification-count").textContent = unreadCount;
      document.getElementById("notification-list").innerHTML =
        notifications.length === 0
          ? '<p class="notification-item">No notifications yet.</p>'
          : notifications.map(item => `
              <div class="notification-item ${item.unread ? "unread" : ""}">
                ${escapeHTML(item.text)}
              </div>
            `).join("");
    }

    function renderNotes() {
      const feed = document.getElementById("notes-feed");
      const notes = getNotes();

      if (notes.length === 0) {
        feed.innerHTML = '<p class="muted">No notes yet.</p>';
        return;
      }

      feed.innerHTML = notes.map(note => {
        const replies = note.replies.map(reply => `
          <div class="reply-item">
            <div class="reply-header">
              <strong>${escapeHTML(reply.author)}</strong>
              <span class="note-time">${escapeHTML(reply.time)}</span>
            </div>
            <div class="note-body">${escapeHTML(reply.text)}</div>
          </div>
        `).join("");

        return `
          <article class="note-card" data-note-id="${Number(note.id)}">
            <div class="note-header">
              <strong class="note-author">${escapeHTML(note.author)}</strong>
              <span class="note-time">${escapeHTML(note.time)}</span>
            </div>
            <div class="note-body">${formatNote(note.text)}</div>
            <div class="note-actions">
              <button class="text-button ${note.liked ? "liked" : ""}"
                      type="button" data-action="like" data-id="${Number(note.id)}">
                ${note.liked ? "❤️" : "🤍"} ${Number(note.likes)}
              </button>
              <button class="text-button" type="button"
                      data-action="pdf" data-id="${Number(note.id)}">
                📄 Open reader
              </button>
              <span class="muted">${note.replies.length} replies</span>
            </div>
            <div class="reply-list">
              ${replies}
              <form class="reply-form" data-note-id="${Number(note.id)}">
                <input name="reply" type="text" maxlength="280"
                       aria-label="Reply to ${escapeHTML(note.author)}"
                       placeholder="Write a reply..." required>
                <button type="submit">Reply</button>
              </form>
            </div>
          </article>
        `;
      }).join("");
    }

    function openPdf(note) {
      document.getElementById("pdf-author").textContent = note.author;
      document.getElementById("pdf-time").textContent = note.time;
      document.getElementById("pdf-content").textContent = note.text;
      document.getElementById("workspace").classList.add("pdf-mode");
    }

    function postNote() {
      const username = currentUsername();
      if (!username) {
        document.getElementById("login-prompt").hidden = false;
        return;
      }

      const input = document.getElementById("note-input");
      const text = input.value.trim();
      if (!text) return;

      const notes = getNotes();
      notes.unshift({
        id: Date.now(),
        author: username,
        time: "Just now",
        text,
        likes: 0,
        liked: false,
        replies: []
      });

      saveJSON(STORAGE_KEYS.notes, notes);
      input.value = "";
      document.getElementById("char-count").textContent = "0";
      renderNotes();
    }

    document.getElementById("note-input").addEventListener("input", event => {
      document.getElementById("char-count").textContent =
        event.currentTarget.value.length;
    });

    document.getElementById("post-button").addEventListener("click", postNote);

    document.getElementById("login-button").addEventListener("click", () => {
      const existingName = currentUsername();
      const name = window.prompt("Enter a username:", existingName || "");
      if (name === null) return;

      const username = name.trim();
      if (!username) {
        localStorage.removeItem(STORAGE_KEYS.username);
        document.getElementById("login-button").textContent = "Log in";
        document.getElementById("login-prompt").hidden = false;
        return;
      }

      localStorage.setItem(STORAGE_KEYS.username, username);
      document.getElementById("login-button").textContent = username;
      document.getElementById("login-prompt").hidden = true;
    });

    document.getElementById("notes-feed").addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = Number(button.dataset.id);
      const notes = getNotes();
      const note = notes.find(item => item.id === id);
      if (!note) return;

      if (button.dataset.action === "pdf") {
        openPdf(note);
      } else if (button.dataset.action === "like") {
        note.liked = !note.liked;
        note.likes = Math.max(0, note.likes + (note.liked ? 1 : -1));
        saveJSON(STORAGE_KEYS.notes, notes);
        renderNotes();
      }
    });

    document.getElementById("notes-feed").addEventListener("submit", event => {
      const form = event.target.closest(".reply-form");
      if (!form) return;

      event.preventDefault();

      const username = currentUsername();
      if (!username) {
        document.getElementById("login-prompt").hidden = false;
        return;
      }

      const noteId = Number(form.dataset.noteId);
      const input = form.elements.reply;
      const text = input.value.trim();
      if (!text) return;

      const notes = getNotes();
      const note = notes.find(item => item.id === noteId);
      if (!note) return;

      note.replies.push({
        id: Date.now(),
        author: username,
        time: "Just now",
        text
      });

      saveJSON(STORAGE_KEYS.notes, notes);
      renderNotes();
    });

    document.getElementById("notification-button").addEventListener("click", () => {
      const menu = document.getElementById("notification-menu");
      const isOpen = menu.classList.toggle("open");
      document.getElementById("notification-button")
        .setAttribute("aria-expanded", String(isOpen));
    });

    document.getElementById("mark-read-button").addEventListener("click", () => {
      const notifications = getNotifications().map(item => ({
        ...item,
        unread: false
      }));
      saveJSON(STORAGE_KEYS.notifications, notifications);
      renderNotifications();
    });

    document.getElementById("close-pdf-button").addEventListener("click", () => {
      document.getElementById("workspace").classList.remove("pdf-mode");
    });

    document.addEventListener("click", event => {
      const menu = document.getElementById("notification-menu");
      const button = document.getElementById("notification-button");

      if (!menu.contains(event.target) && !button.contains(event.target)) {
        menu.classList.remove("open");
        button.setAttribute("aria-expanded", "false");
      }
    });

    const username = currentUsername();
    if (username) {
      document.getElementById("login-button").textContent = username;
      document.getElementById("login-prompt").hidden = true;
    }

    renderNotifications();
    renderNotes();
  </script>
</body>
</html>
