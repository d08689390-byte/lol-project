<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Welcome to the lol project!
    </title>
    <style>
      * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0f8ff;
      color: #1f2937;
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 20px 60px 20px;
    }

    #lollogo {
      text-align: center;
      margin-bottom: 20px;
    }

    #lollogo img {
      height: 120px;
      max-width: 100%;
      width: auto;
      display: inline-block;
    }

    .header-nav-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      max-width: 640px;
      margin: 0 auto 24px auto;
    }

    .nav-wrapper {
      position: relative;
    }

    .profile-link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1f2937;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: 1px solid #d1d5db;
      padding: 8px 16px;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .profile-link-btn:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    .profile-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .nav-dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      width: 190px;
      z-index: 100;
      overflow: hidden;
    }

    .nav-dropdown-menu a {
      display: block;
      padding: 10px 16px;
      text-decoration: none;
      color: #374151;
      font-size: 0.95rem;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s ease;
    }

    .nav-dropdown-menu a:last-child {
      border-bottom: none;
    }

    .nav-dropdown-menu a:hover {
      background: #f3f4f6;
    }

    .nav-dropdown-menu a.logout-link {
      color: #dc2626;
      font-weight: 500;
    }

    #site-content {
      max-width: 640px;
      margin: 0 auto 24px auto;
      padding: 28px 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 1.85rem;
      color: #111827;
      margin-bottom: 10px;
    }

    #lolinfo p {
      color: #4b5563;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    #lolinfo p:last-child {
      margin-bottom: 0;
    }

    /* Composer & Feed Styles */
    .feed-container {
      max-width: 640px;
      margin: 0 auto;
    }

    .composer-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    .composer-card textarea {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .composer-card textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-count {
      font-size: 0.85rem;
      color: #6b7280;
    }

    .post-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 9px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .post-btn:hover {
      background-color: #1d4ed8;
    }

    .login-prompt {
      text-align: center;
      color: #4b5563;
      font-size: 0.95rem;
    }

    .login-prompt a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }

    .login-prompt a:hover {
      text-decoration: underline;
    }

    .feed-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 14px;
      padding-left: 4px;
    }

    .note-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      margin-bottom: 14px;
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .note-author-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .note-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .note-author {
      font-weight: 700;
      color: #111827;
      font-size: 0.95rem;
    }

    .note-handle {
      color: #6b7280;
      font-size: 0.85rem;
    }

    .note-time {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .note-body {
      color: #1f2937;
      font-size: 1rem;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }

    .note-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      border-top: 1px solid #f3f4f6;
      padding-top: 10px;
    }

    .action-btn {
      background: none;
      border: none;
      color: #6b7280;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s;
    }

    .action-btn:hover {
      color: #2563eb;
    }

    .action-btn.liked {
      color: #e11d48;
    }

    .action-btn.delete:hover {
      color: #dc2626;
    }
    </style>
  </head>
  <body>
    <!-- TOP CENTER LOGO -->
    <div id="lollogo">
      <img src="lollogo.png" alt="Lol Project Logo" id="lollogoImage">
    </div>
    <header class="header-nav-container">
      <div class="nav-wrapper">
        <button type="button" class="profile-link-btn" id="dynamic-user-nav" onclick="handleNavClick(event)">
          <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4">
            </circle>
            <path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6">
            </path>
          </svg>
          <span id="nav-button-text">
            Login/Sign Up
          </span>
        </button>
        <!-- Account Actions Dropdown -->
        <div class="nav-dropdown-menu" id="account-dropdown">
          <a href="account.html">
            ⚙️ Settings
          </a>
          <a href="account.html">
            👤 Profile
          </a>
          <a href="account.html">
            📁 Documents
          </a>
          <a href="messages.html">
            ✉️ Messages
          </a>
          <a href="#" class="logout-link" onclick="logoutUser(event)">
            🚪 Log Out
          </a>
        </div>
      </div>
    </header>
    <main id="site-content">
      <h1>
        Welcome to the lol project!
      </h1>
      <div id="lolinfo">
        <p>
          The lol project is a social platform made by Denis Kuizinas in November 2026 - April 2027.
        </p>
        <p>
          Share quick notes, random thoughts, and jokes with everyone.
        </p>
      </div>
    </main>
    <!-- SOCIAL NOTES FEED -->
    <section class="feed-container">
      <div class="composer-card" id="composer-box">
        <!-- Populated by JS depending on login state -->
      </div>
      <h2 class="feed-title">
        Latest Notes
      </h2>
      <div id="notes-feed">
      </div>
    </section>
    <script>
      const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
    const currentUser = localStorage.getItem('username') || 'Guest';

    const starterNotes = [
      {
        id: 1,
        author: "Denis Kuizinas",
        handle: "@denis",
        time: "2h ago",
        text: "Welcome to the lol project! Post your first note—whether it's a random thought, an update, or a terrible pun.",
        likes: 12,
        liked: false
      },
      {
        id: 2,
        author: "Sarah M.",
        handle: "@sarahm",
        time: "45m ago",
        text: "Just spent 20 minutes debugging my CSS only to realize I forgot a closing curly brace. Classic.",
        likes: 7,
        liked: false
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const navText = document.getElementById('nav-button-text');
      navText.innerText = isLoggedIn ? currentUser : "Login/Sign Up";

      renderComposer();
      renderNotes();
    });

    function renderComposer() {
      const box = document.getElementById('composer-box');
      if (!isLoggedIn) {
        box.innerHTML = `
      <p class="login-prompt">
        Want to share a note?
        <a href="login.html">
          Log in or Sign up
        </a>
        to join the conversation!
      </p>
      `;
        return;
      }

      box.innerHTML = `
      <textarea id="note-input" rows="3" maxlength="280" placeholder="What's on your mind? Share a note or a joke..." oninput="updateCharCount()">
      </textarea>
      <div class="composer-footer">
        <span class="char-count" id="char-count">
          0 / 280
        </span>
        <button type="button" class="post-btn" onclick="postNote()">
          Post Note
        </button>
      </div>
      `;
    }

    function updateCharCount() {
      const input = document.getElementById('note-input');
      const count = document.getElementById('char-count');
      count.innerText = `${input.value.length} / 280`;
    }

    function getNotes() {
      const saved = localStorage.getItem('lolNotes');
      return saved ? JSON.parse(saved) : starterNotes;
    }

    function saveNotes(notes) {
      localStorage.setItem('lolNotes', JSON.stringify(notes));
    }

    function postNote() {
      const input = document.getElementById('note-input');
      const text = input.value.trim();
      if (!text) return;

const notes = getNotes();
const newNote = {
id: Date.now(),
author: currentUser,
handle: '@' + currentUser.toLowerCase().replace(/\s+/g, ''),
time: 'Just now',
text: text,
likes: 0,
liked: false
};
notes.unshift(newNote);
saveNotes(notes);
input.value = '';
updateCharCount();
renderNotes();
}
function toggleLike(id) {
const notes = getNotes();
const note = notes.find(n => n.id === id);
if (!note) return;
note.liked = !note.liked;
note.likes += note.liked ? 1 : -1;
saveNotes(notes);
renderNotes();
}
function deleteNote(id) {
const notes = getNotes().filter(n => n.id !== id);
saveNotes(notes);
renderNotes();
}
function renderNotes() {
const feed = document.getElementById('notes-feed');
const notes = getNotes();
feed.innerHTML = '';
notes.forEach(note => {
const isOwner = isLoggedIn && note.author === currentUser;
const card = document.createElement('article');
card.className = 'note-card';
card.innerHTML =
      <div class="note-header">
        <div class="note-author-info">
          <div class="note-avatar">
            ${note.author.charAt(0).toUpperCase()}
          </div>
          <div>
            <div class="note-author">
              ${note.author}
            </div>
            <div class="note-handle">
              ${note.handle}
            </div>
          </div>
        </div>
        <span class="note-time">
          ${note.time}
        </span>
      </div>
      <div class="note-body">
        ${escapeHTML(note.text)}
      </div>
      <div class="note-actions">
        <button type="button" class="action-btn ${note.liked ? 'liked' : ''}" onclick="toggleLike(${note.id})">
          ${note.liked ? '❤️' : '🤍'} ${note.likes}
        </button>
        ${isOwner ?🗑️ Delete: ''}
      </div>
      ;
feed.appendChild(card);
});
}
function escapeHTML(str) {
return str.replace(/[&
      <>
        '"]/g, tag => ({
'&': '&',
'
        <': '<',
'>
          ': '>',
"'": ''',
'"': '"'
}[tag]));
}
function handleNavClick(e) {
if (e) e.stopPropagation();
if (!isLoggedIn) {
window.location.href = "login.html";
} else {
const dropdown = document.getElementById('account-dropdown');
dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
}
}
function logoutUser(e) {
e.preventDefault();
localStorage.setItem('loggedIn', 'false');
window.location.reload();
}
window.addEventListener('click', (e) => {
const navButton = document.getElementById('dynamic-user-nav');
const dropdown = document.getElementById('account-dropdown');
if (navButton && dropdown && !navButton.contains(e.target)) {
dropdown.style.display = 'none';
}
});
