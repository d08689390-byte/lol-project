<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - The lol project</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0f8ff;
      color: #1f2937;
      line-height: 1.6;
      padding: 24px 20px 40px 20px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
    }

    #lollogo {
      margin-bottom: 20px;
    }

    #lollogo img {
      height: 120px;
      max-width: 100%;
      width: auto;
      display: inline-block;
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 32px;
      color: #111827;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      text-align: left;
    }

    .auth-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
    }

    .auth-card h2 {
      font-size: 1.35rem;
      margin-bottom: 20px;
      color: #111827;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: auto;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .back-link {
      display: inline-block;
      margin-top: 28px;
      color: #4b5563;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- TOP CENTER LOGO -->
    <div id="lollogo">
      <img src="lollogo.png" alt="Lol Project Logo" id="lollogoImage">
    </div>

    <h1>Login / Sign Up to the lol project</h1>

    <div class="auth-grid">
      <!-- Login Form -->
      <div id="lollogin" class="auth-card">
        <h2>Login Here</h2>
        <div class="form-group">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Enter password">
        </div>
        <button id="login-btn" type="button">Login</button>
      </div>

      <!-- Sign Up Form -->
      <div id="lolsignup" class="auth-card">
        <h2>Sign Up Here</h2>
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input id="signup-username" type="text" placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="Create password">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" placeholder="Repeat password">
        </div>
        <button id="signup-btn" type="button">Sign Up</button>
      </div>
    </div>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <script>
    document.getElementById('login-btn').addEventListener('click', () => {
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value;

      if (!user || !pass) {
        alert('Please enter both a username and password.');
        return;
      }

      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('username', user);
      window.location.href = 'index.html';
    });

    document.getElementById('signup-btn').addEventListener('click', () => {
      const user = document.getElementById('signup-username').value.trim();
      const pass = document.getElementById('signup-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (!user || !pass) {
        alert('Please fill out all fields.');
        return;
      }
      if (pass !== confirmPass) {
        alert('Passwords do not match.');
        return;
      }

      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('username', user);
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
